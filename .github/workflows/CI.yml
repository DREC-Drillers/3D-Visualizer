name: Visualizer CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, demo]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Configure
        run: nix develop --command cmake --preset ${{ matrix.preset }}
      - name: Build
        run: nix develop --command cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        if: matrix.preset != 'release'
        run: nix develop --command ctest --preset ${{ matrix.preset }}
      - name: Build Nix package
        if: matrix.preset == 'release'
        run: nix build .#default --no-link
      - name: Verify installed package
        if: matrix.preset == 'demo'
        run: |
          nix develop --command bash -euo pipefail -c '
            cmake --install build/demo --prefix "$PWD/build/install"
            cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/install"
            cmake --build build/consumer --parallel 2
            ./build/consumer/consumer
          '

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - run: python3 scripts/code_quality.py format

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Configure
        run: nix develop --command cmake --preset demo
      - name: Build
        run: nix develop --command cmake --build --preset demo --parallel 2
      - name: Analyze
        run: nix develop --command python3 scripts/code_quality.py tidy --build-dir build/demo
